spring.application.name=code-review-agent

# Return errors as RFC 9457 "problem details" JSON
spring.mvc.problemdetails.enabled=true

# Which brain the agent uses:
#   rule   = deterministic planner, no install needed (default)
#   ollama = a real local LLM decides each step
agent.planner=rule
agent.max-steps=40

ollama.base-url=http://localhost:11434
ollama.model=qwen2.5:7b

# GitHub API. A token is optional: without one you get 60 requests/hour,
# with one (export GITHUB_TOKEN=...) you get 5,000/hour.
github.api-url=https://api.github.com
github.token=${GITHUB_TOKEN:}

# Which change-risk model the agent uses:
#   heuristic = lines-added rule, no AWS needed (default)
#   sagemaker = the trained model on your SageMaker serverless endpoint (run `aws login` first)
risk.model=heuristic
risk.sagemaker.endpoint=code-review-risk
risk.sagemaker.region=us-east-2
